<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · Clínica MultiverCidades Acre</title>
  <style>
    /* Estilos embutidos: esta página pode ser servida em qualquer endereço do site. */
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: radial-gradient(60% 60% at 70% 30%, rgb(226 165 69 / .22), transparent 70%), #F5EFE6;
      color: #2B211B;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 34rem; }
    .codigo { margin: 0; font-size: clamp(4.5rem, 18vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; color: #99401F; }
    h1 { margin: .4rem 0 .8rem; font-size: clamp(1.6rem, 5vw, 2.2rem); color: #1D5C3A; }
    p { margin: 0 0 1.6rem; color: #5C4D42; line-height: 1.6; }
    a {
      display: inline-block;
      padding: .9rem 1.5rem;
      border-radius: 999px;
      background: #1D5C3A;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #143F28; }
    a:focus-visible { outline: 3px solid #D08F33; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Esta página não existe</h1>
    <p>O endereço pode ter mudado ou estar digitado errado. Todo o conteúdo da Clínica MultiverCidades Acre está na página inicial.</p>
    <a id="inicio" href="/">Ir para a página inicial</a>
  </main>
  <script>
    // No GitHub Pages de projeto o site fica em /nome-do-repositorio/.
    // Se esse caminho responder, o botão passa a apontar para ele.
    (function () {
      var seg = location.pathname.split('/')[1];
      if (!seg || !window.fetch) return;
      fetch('/' + seg + '/assets/css/style.css', { method: 'HEAD' }).then(function (r) {
        if (r.ok) document.getElementById('inicio').href = '/' + seg + '/';
      }).catch(function () {});
    })();
  </script>
</body>
</html>
